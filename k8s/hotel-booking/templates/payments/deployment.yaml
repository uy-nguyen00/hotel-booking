apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: payments
  name: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      automountServiceAccountToken: false
      containers:
        - image: '{{ .Values.images.registry }}/payments/production:{{ required "images.tag is required" .Values.images.tag }}'
          imagePullPolicy: "{{ .Values.images.pullPolicy }}"
          name: payments
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              memory: 256Mi
          env:
            - name: PORT
              value: '3001'

            - name: NOTIFICATIONS_HOST
              value: notifications

            - name: NOTIFICATIONS_PORT
              value: '3000'

            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: stripe
                  key: apiKey
          ports:
            - containerPort: 3001
