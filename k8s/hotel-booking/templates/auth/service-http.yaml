apiVersion: v1
kind: Service
metadata:
  labels:
    app: auth
  name: auth-http
{{- with .Values.services.authHttp.annotations }}
  annotations:
{{ toYaml . | nindent 4 }}
{{- end }}
spec:
  ports:
    - name: 'http'
      port: 3003
      protocol: TCP
      targetPort: 3003
  selector:
    app: auth
  type: NodePort
