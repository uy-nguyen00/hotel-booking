{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hotel-booking
{{- with .Values.ingress.annotations }}
  annotations:
{{ toYaml . | nindent 4 }}
{{- end }}
spec:
{{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
{{- end }}
{{- if .Values.ingress.defaultBackend.enabled }}
  defaultBackend:
    service:
      name: {{ required "ingress.defaultBackend.serviceName is required" .Values.ingress.defaultBackend.serviceName | quote }}
      port:
        number: {{ required "ingress.defaultBackend.servicePort is required" .Values.ingress.defaultBackend.servicePort }}
{{- end }}
  rules:
    - host: {{ required "ingress.host is required" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: auth-http
                port:
                  number: 3003
          - path: /reservations
            pathType: Prefix
            backend:
              service:
                name: reservations
                port:
                  number: 3004
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: auth-http
                port:
                  number: 3003
          - path: /users
            pathType: Prefix
            backend:
              service:
                name: auth-http
                port:
                  number: 3003
{{- end }}
