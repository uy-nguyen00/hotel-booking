apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hotel-booking
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /reservations
            pathType: Prefix
            backend:
              service:
                name: reservations
                port:
                  number: 3004
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: auth-http
                port:
                  number: 3003
          - path: /users
            pathType: Prefix
            backend:
              service:
                name: auth-http
                port:
                  number: 3003
