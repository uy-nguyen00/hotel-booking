{{- if and .Values.ingress.enabled .Values.ingress.managedCertificate.enabled }}
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: {{ required "ingress.managedCertificate.name is required" .Values.ingress.managedCertificate.name | quote }}
spec:
  domains:
{{- range required "ingress.managedCertificate.domains is required" .Values.ingress.managedCertificate.domains }}
    - {{ . | quote }}
{{- end }}
{{- end }}
